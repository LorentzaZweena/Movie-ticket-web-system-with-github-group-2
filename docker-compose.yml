services:
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: movieticket-nginx
    ports:
      - "80:80"
    volumes:
      - .:/var/www/myphpapp
      - ./default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - movieticket-net

  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: movieticket-php
    volumes:
      - .:/var/www/myphpapp
    networks:
      - movieticket-net

  mysql:
    image: mysql:8.0
    container_name: movieticket-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: db_movieticket
    ports:
      - "3306:3306"
    volumes:
      - db_movieticket_data:/var/lib/mysql
      - ./db_movieticket.sql:/docker-entrypoint-initdb.d/db_movieticket.sql
    networks:
      - movieticket-net

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: movieticket-phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "8080:80"
    depends_on:
      - mysql
    networks:
      - movieticket-net

networks:
  movieticket-net:
    driver: bridge

volumes:
  db_movieticket_data:
